<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Silicon Valley Investclub</title>
  <link rel="icon" type="image/png" href="/portal/assets/favicon.png">
  <link rel="stylesheet" href="/portal/assets/fonts.css">
  <link rel="stylesheet" href="/portal/assets/app.css">
  <link rel="stylesheet" href="/portal/assets/portal.css">
</head>
<body class="fluid">
<header class="topbar has-topnav">
  <div class="topbar-in">
    <div class="tb-left">
      <button class="tb-burger" id="pBurger" type="button" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="tb-brand" id="pHome" href="/" aria-label="Silicon Valley Investclub">
        <img class="tb-logo" src="/portal/assets/logo.svg" alt="Silicon Valley Investclub">
        <span class="tb-div"></span><span class="tb-ctx" id="pCtx"></span>
      </a>
    </div>
    <nav class="tb-nav" id="pNav" aria-label="Sections"></nav>
    <div class="tb-right">
      <div class="tb-user"><span class="tb-user-name" id="pName"></span></div>
      <a class="tb-nav-out" id="pOut" href="/logout">Sign out</a>
    </div>
  </div>
</header>
<div class="page-head"><div class="controls" id="pControls"></div></div>
<main class="p-wrap" id="pMain" aria-live="polite"><div class="empty"><span class="serif">Loading…</span></div></main>
<div id="pOverlay"></div>
<div id="modalOverlay"></div>
<div id="toast" role="status"></div>
<script src="/portal/assets/member-photo.js"></script>
<script src="/portal/assets/portal.js"></script>
</body>
</html>
