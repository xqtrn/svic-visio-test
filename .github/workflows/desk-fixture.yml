name: desk-fixture
# Trade Desk Matches with the branch page and a fixture desk (production terms,
# cast partners) in a real browser — WebKit iPhone or desktop Chromium.
on:
  workflow_dispatch:
    inputs:
      engine: { description: 'webkit | chromium', default: 'webkit' }
      candidate: { description: '1 = candidate preview', default: '0' }
      tag: { description: 'Artifact tag', default: 'run' }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null
      - uses: ./.github/actions/install-playwright
        with:
          browsers: ${{ inputs.engine }}
          playwright-version: '1.49.0'
      - run: rm -rf out && timeout 600 node desk-fixture.mjs
        env:
          ENGINE: ${{ inputs.engine }}
          CANDIDATE: ${{ inputs.candidate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-fixture-${{ inputs.engine }}-${{ inputs.tag }}
          path: out/
