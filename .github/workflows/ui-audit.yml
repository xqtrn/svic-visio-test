name: ui-audit
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base URL (https://host)'
        required: true
      paths:
        description: 'Space-separated paths'
        default: '/'
      cookies:
        description: 'name=value;name2=value2 (host-only)'
        default: ''
      localstorage:
        description: 'key=value;key2=value2 set before page load (e.g. TOU flag)'
        default: ''
      mode:
        description: 'mobile or desktop'
        default: 'mobile'
      expected:
        description: 'Space-separated exact hrefs for desktop mode'
        default: ''
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null
      - if: inputs.mode != 'desktop'
        run: npx playwright install --with-deps webkit
      - if: inputs.mode == 'desktop'
        run: npx playwright install --with-deps chromium
      - if: inputs.mode != 'desktop'
        run: sudo apt-get install -y gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad >/dev/null 2>&1 || true
      - if: inputs.mode != 'desktop'
        run: rm -rf out && node ui-audit.js
        env:
          BASE: ${{ inputs.base }}
          PATHS: ${{ inputs.paths }}
          COOKIES: ${{ inputs.cookies || secrets.UI_AUDIT_COOKIES }}
          LOCALSTORAGE: ${{ inputs.localstorage }}
      - if: inputs.mode == 'desktop'
        run: rm -rf out-desktop && node closed-task-desktop-audit.js
        env:
          BASE: ${{ inputs.base }}
          PATHS: ${{ inputs.paths }}
          EXPECTED: ${{ inputs.expected }}
          COOKIES: ${{ inputs.cookies || secrets.UI_AUDIT_COOKIES }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit-out
          path: |
            out/
            out-desktop/
