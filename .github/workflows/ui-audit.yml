name: ui-audit
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base URL (https://host)'
        required: true
      paths:
        description: 'Space-separated paths'
        default: '/'
      cookies:
        description: 'name=value;name2=value2 (host-only)'
        default: ''
      localstorage:
        description: 'key=value;key2=value2 set before page load (e.g. TOU flag)'
        default: ''
      settle:
        description: 'ms to wait after DOMContentLoaded before screenshots'
        default: '4000'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: lock — установка браузера не ходит в сырой apt
        run: node --test scripts/apt-install-throat.test.mjs
      - run: npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null
      - uses: ./.github/actions/install-playwright
        with:
          browsers: webkit
          playwright-version: '1.49.0'
          extra-apt: gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - run: rm -rf out && node ui-audit.js
        env:
          BASE: ${{ inputs.base }}
          PATHS: ${{ inputs.paths }}
          # cookie из секрета — публичный репо, JWT в input светился бы в логах ран-а
          COOKIES: ${{ inputs.cookies || secrets.UI_AUDIT_COOKIES }}
          LOCALSTORAGE: ${{ inputs.localstorage }}
          SETTLE_MS: ${{ inputs.settle }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-audit-out, path: out/ }
