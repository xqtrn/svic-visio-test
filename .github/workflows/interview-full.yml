name: interview-full
# Полная запись интервью в НАШЕМ хранилище (Артур 2026-08-04: «сделай, чтобы видео
# YouTube играло в нашем плеере»). Канон 07-10 «интервью живёт на YouTube» снимается
# постепенно: здесь — точечная загрузка по списку id, чтобы проверить полосу на одной
# статье, прежде чем переводить все двадцать.
#
# Имя файла — full-<id>.mp4, отдельно от карточных артефактов: <id>.mp4 у интервью
# исторически ЭТО 24-секундная нарезка, а iv-<id>.mp4 — превью обложки. Отдельное имя
# = однозначный признак «полная запись у нас есть», по нему статья и решает, чем играть.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'YouTube id через запятую'
        required: true
permissions: { contents: write }
concurrency: { group: interview-full, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade yt-dlp
          # HD БЕЗ ТОКЕНА YOUTUBE НЕ ОТДАЁТ (замер 2026-08-04): web-клиентам он
          # возвращает одни раскадровки, а мобильным — прогрессивные 360p. Провайдер
          # ниже выдаёт proof-of-origin токен, с которым открываются раздельные
          # потоки, то есть настоящее 720/1080. Всё живёт внутри прогона.
          docker run -d --name pot --restart unless-stopped -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider || echo "провайдер не поднялся"
          python3 -m pip install --quiet bgutil-ytdlp-pot-provider || true
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4416/ping >/dev/null && { echo "провайдер токена готов"; break; }; sleep 3; done
      - name: download full interview masters
        env:
          GH_TOKEN: ${{ github.token }}
          PENGUIN_SOCKS: ${{ secrets.PENGUIN_SOCKS }}
        run: |
          OK=0; FAIL=0
          for VID in $(echo "${{ inputs.ids }}" | tr ',' ' '); do
            echo "=== $VID ==="
            rm -f in.mp4 "full-$VID.mp4"
            sleep 8   # пауза перед YouTube: поток запросов включает анти-бот
            # Клиенты web_safari/web отдают раздельные потоки (DASH) — из них и берётся HD.
            # Порядок с ios первым давал прогрессивный 360p: интервью на странице выглядело
            # хуже, чем на YouTube (2026-08-04). Ступени ниже 720 берём только как аварию.
            # Сначала — с токеном и БЕЗ прокси: токен привязан к адресу, с которого
            # он получен, и через чужой выход теряет силу. Не вышло — прежний путь
            # через домашний узел (там потолок 360p, такую запись мы не публикуем).
            # HD = ключ происхождения И жилой адрес ВМЕСТЕ (замер 2026-08-04): ключ с
            # адреса дата-центра упирается в «подтвердите, что вы не робот», а жилой
            # адрес без ключа получает только прогрессивные 360p. Ключ выдаёт провайдер
            # на раннере (он привязан к сессии, не к адресу), видео тянем через
            # домашний узел. Не вышло — прежний путь без ключа (там 360p, и такую
            # запись мы не публикуем).
            FMT='bv*[height<=1080][vcodec^=avc1]+ba[ext=m4a]/bv*[height<=1080]+ba/b[height<=1080][ext=mp4]/b[ext=mp4]/b'
            yt-dlp --no-playlist --no-progress --no-warnings --proxy "$PENGUIN_SOCKS" \
              --extractor-args "youtube:player_client=web_safari,web,tv;fetch_pot=always;formats=missing_pot" \
              -f "$FMT" --merge-output-format mp4 -o in.mp4 "https://www.youtube.com/watch?v=$VID" \
            || yt-dlp --no-playlist --no-progress --no-warnings --proxy "$PENGUIN_SOCKS" \
              --extractor-args "youtube:player_client=web_safari,web,ios,android" \
              -f "$FMT" --merge-output-format mp4 -o in.mp4 "https://www.youtube.com/watch?v=$VID" \
            || { FAIL=$((FAIL+1)); continue; }
            SZ=$(stat -c%s in.mp4 2>/dev/null || echo 0); [ "$SZ" -lt 200000 ] && { echo "слишком мал — не запись"; FAIL=$((FAIL+1)); continue; }
            # СУБТИТРЫ (Артур 2026-08-04 «нет титр»): у интервью на YouTube они есть —
            # свои или автоматические. Забираем вместе с записью и кладём рядом, иначе
            # наш плеер честно не покажет кнопку CC, а зритель потеряет то, что было.
            rm -f subs.en.vtt "full-$VID.en.vtt"
            yt-dlp --no-playlist --no-warnings --skip-download --proxy "$PENGUIN_SOCKS" \
              --extractor-args "youtube:player_client=web_safari,web,ios,android" \
              --write-subs --write-auto-subs --sub-langs "en.*,en" --convert-subs vtt \
              -o "subs.%(ext)s" "https://www.youtube.com/watch?v=$VID" || echo "субтитров нет"
            SUB=$(ls subs*.vtt 2>/dev/null | head -1)
            if [ -n "$SUB" ]; then
              mv "$SUB" "full-$VID.en.vtt"
              gh release upload clips2 "full-$VID.en.vtt" -R "$GITHUB_REPOSITORY" --clobber && echo "субтитры выложены" || echo "субтитры не залились"
            fi
            SRCH=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 in.mp4 | head -1)
            echo "исходная высота: ${SRCH:-?}"
            # интервью в 360p на всю ширину колонки выглядит хуже, чем вставка YouTube —
            # такую запись не выкладываем, лучше оставить прежний фасад
            if [ -n "$SRCH" ] && [ "$SRCH" -lt 480 ]; then
              echo "СЛИШКОМ НИЗКОЕ КАЧЕСТВО ($SRCH) — не выкладываю. Что вообще отдаёт YouTube:"
              for CL in web_safari web tv mweb ios android; do
                echo "--- клиент $CL:"
                yt-dlp --no-playlist --no-warnings --skip-download --proxy "$PENGUIN_SOCKS" \
                  --extractor-args "youtube:player_client=$CL" -F "https://www.youtube.com/watch?v=$VID" 2>&1 | tail -12
              done
              FAIL=$((FAIL+1)); continue
            fi
            # faststart обязателен: без него iOS читает заголовок в конце файла и зацикливает первые секунды
            H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 in.mp4 | head -1)
            if [ -n "$H" ] && [ "$H" -gt 1080 ]; then
              ffmpeg -nostdin -hide_banner -loglevel error -i in.mp4 -vf scale=-2:1080 -c:v libx264 -preset veryfast -crf 23 -c:a aac -movflags +faststart "full-$VID.mp4"
            else
              ffmpeg -nostdin -hide_banner -loglevel error -i in.mp4 -c copy -movflags +faststart "full-$VID.mp4" 2>/dev/null \
                || ffmpeg -nostdin -hide_banner -loglevel error -i in.mp4 -c:v libx264 -preset veryfast -crf 23 -c:a aac -movflags +faststart "full-$VID.mp4"
            fi
            # без звука запись бесполезна — это интервью, а не обложка
            if [ -z "$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "full-$VID.mp4" | head -1)" ]; then
              echo "НЕТ ЗВУКОВОЙ ДОРОЖКИ — не выкладываю"; FAIL=$((FAIL+1)); continue
            fi
            # ступени качества для меню плеера
            for QH in 720 480; do
              SH=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "full-$VID.mp4" | head -1)
              [ -n "$SH" ] && [ "$SH" -gt "$QH" ] \
                && ffmpeg -nostdin -hide_banner -loglevel error -i "full-$VID.mp4" -vf scale=-2:$QH -c:v libx264 -preset veryfast -crf 24 -c:a aac -movflags +faststart "full-$VID.$QH.mp4" \
                && gh release upload clips2 "full-$VID.$QH.mp4" -R "$GITHUB_REPOSITORY" --clobber && rm -f "full-$VID.$QH.mp4"
            done
            gh release upload clips2 "full-$VID.mp4" -R "$GITHUB_REPOSITORY" --clobber && OK=$((OK+1)) || FAIL=$((FAIL+1))
            ffprobe -v error -show_entries format=duration,size -of csv=p=0 "full-$VID.mp4"
          done
          echo "=== masters=$OK failed=$FAIL ==="
          [ "$FAIL" = "0" ]
