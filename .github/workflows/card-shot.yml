name: card-shot
on:
  workflow_dispatch:
    inputs:
      url:
        description: "page URL (default: company card, static view)"
        required: false
        default: ''
permissions:
  contents: read
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null
      - uses: ./.github/actions/install-playwright
        with:
          browsers: chromium
          playwright-version: '1.49.0'
      - run: SHOT_URL="${{ inputs.url }}" node card-shot.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: card-shots, path: out/ }
