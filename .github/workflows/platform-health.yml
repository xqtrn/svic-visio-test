name: platform-health
# Здоровье стенда без WordPress (Артур 2026-07-26: сайт стал основным, копирование
# из WP удалено). Проверяет наш origin и админку; при проблеме — задача на
# /developement (Артур 2026-08-03: «вместо этих сообщений сразу добавь задачи»).
# Проба ежечасная, поэтому одна карточка обновляется, пока проблема держится, и
# закрывается сама, когда проба снова зелёная.
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm init -y >/dev/null 2>&1 && npm i pg jsonwebtoken >/dev/null 2>&1
      - name: probe
        env:
          DATABASE_URL: ${{ secrets.SVIC_PLATFORM_DATABASE_URL }}
          SVIC_INTERNAL_KEY: ${{ secrets.SVIC_INTERNAL_KEY }}
          PLATFORM_SESSION_SECRET: ${{ secrets.PLATFORM_SESSION_SECRET }}
        run: |
          cat > health.mjs <<'JS'
          import pg from 'pg';
          import { openTask, closeTask } from './scripts/system-task.mjs';
          const ORIGIN = 'https://svic-platform-production.up.railway.app';
          const TASK_KEY = 'stand-platform-health';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
          const problems = [];
          try {
            const st = await (await fetch(ORIGIN + '/api/status')).json();
            if (!st.ok || !st.db) problems.push('origin /api/status: не ok/db');
            const ver = await fetch(ORIGIN + '/api/site/__version');
            if (ver.status !== 200) problems.push(`/api/site/__version: HTTP ${ver.status}`);
            if (process.env.PLATFORM_SESSION_SECRET) {
              const { default: jwt } = await import('jsonwebtoken');
              const tok = jwt.sign({ userId: 1, telegramUsername: 'sensor', displayName: 'sensor', role: 'admin' }, process.env.PLATFORM_SESSION_SECRET, { expiresIn: '10m' });
              const r = await fetch(ORIGIN + '/api/admin/posts?limit=1', { headers: { Cookie: 'svic_token=' + tok } });
              const total = r.status === 200 ? (await r.json()).total || 0 : 0;
              if (total < 1000) problems.push(`админка: /api/admin/posts total=${total} (HTTP ${r.status}) — пустая выдача`);
            }
          } catch (e) { problems.push('health-пробы упали: ' + e.message); }
          // ХРАНИЛИЩЕ МЕДИАТЕКИ ОТВЕЧАЕТ (2026-08-15). 15 августа AWS закрыл аккаунт по
          // исчерпанию кредитов — картинки и видео пропали со всего сайта, и заметил это
          // Артур по скриншоту, а не мы. Проба берёт ЖИВУЮ картинку с главной и требует
          // настоящие байты: молчащее хранилище (умерший ключ, закрытый аккаунт, пустой
          // бакет) теперь становится задачей в тот же час.
          try {
            const { rows } = await pool.query(
              `SELECT coalesce(cdn_url, source_url) u FROM media WHERE mime LIKE 'image/%' ORDER BY id DESC LIMIT 3`);
            for (const { u } of rows) {
              if (!u || !u.startsWith('/')) continue;
              const r = await fetch('https://siliconvalleyinvestclub.com' + u + (u.includes('?') ? '&' : '?') + 'probe=' + Date.now(),
                { redirect: 'follow' });
              const buf = r.ok ? await r.arrayBuffer() : null;
              if (!r.ok || !buf || buf.byteLength < 512 || !String(r.headers.get('content-type') || '').startsWith('image/')) {
                problems.push(`хранилище картинок не отдаёт файл: ${u} (HTTP ${r.status}, ${buf ? buf.byteLength : 0} байт)`);
                break;
              }
            }
          } catch (e) { problems.push('проверка хранилища картинок упала: ' + e.message); }
          // контент на месте: снимки опубликованных статей не должны исчезать
          try {
            const { rows } = await pool.query(`SELECT count(*)::int c FROM posts WHERE status='publish' AND (full_html IS NULL OR full_html='')`);
            if (rows[0].c > 0) problems.push(`${rows[0].c} опубликованных статей без готовой страницы`);
          } catch (e) { problems.push('проверка снимков упала: ' + e.message); }
          if (problems.length) {
            await openTask({
              key: TASK_KEY,
              summary: `Платформа отвечает не так, как должна: ${problems[0]}${problems.length > 1 ? ` (и ещё ${problems.length - 1})` : ''}`,
              details: problems.join('\n'),
              instructions: 'Разобраться, почему проба здоровья платформы не проходит, устранить причину и дождаться зелёной пробы.',
            });
          } else {
            await closeTask(TASK_KEY, 'Проба здоровья платформы снова зелёная.');
          }
          try {
            await pool.query("INSERT INTO audit_log (actor, action, entity_type, after) VALUES ('daemon:platform-health','daemon.run','daemon:platform-health',$1)",
              [JSON.stringify({ status: problems.length ? 'warn' : 'ok', problems })]);
          } catch {}
          await pool.end();
          console.log(problems.length ? '⚠️ ' + problems.join(' | ') : '✅ платформа здорова');
          JS
          node health.mjs
