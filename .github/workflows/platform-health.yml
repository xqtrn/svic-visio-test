name: platform-health
# Здоровье стенда без WordPress (Артур 2026-07-26: сайт стал основным, копирование
# из WP удалено). Проверяет публичный сайт и админку; при проблеме — задача на
# /developement (Артур 2026-08-03: «вместо этих сообщений сразу добавь задачи»).
# Проба ежечасная, поэтому одна карточка обновляется, пока проблема держится, и
# закрывается сама, когда проба снова зелёная.
#
# 26.08 origin на *.up.railway.app закрыт без служебного ключа. Сторож ходит
# по адресу посетителя (siliconvalleyinvestclub.com), иначе честно видит 404
# на живом сайте.
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm init -y >/dev/null 2>&1 && npm i pg jsonwebtoken >/dev/null 2>&1
      - name: lock — проба не ходит на закрытый Railway-origin
        run: node --test scripts/platform-health.lock.test.mjs
      - name: probe
        env:
          DATABASE_URL: ${{ secrets.SVIC_PLATFORM_DATABASE_URL }}
          SVIC_INTERNAL_KEY: ${{ secrets.SVIC_INTERNAL_KEY }}
          PLATFORM_SESSION_SECRET: ${{ secrets.PLATFORM_SESSION_SECRET }}
        run: node scripts/platform-health.mjs
