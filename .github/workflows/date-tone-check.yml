name: date-tone-check
# Живая проверка цвета даты над кадром YouTube на карточках сайта (scripts/date-tone-check.mjs).
on:
  workflow_dispatch:
    inputs:
      url: { description: 'страница', required: false, default: 'https://siliconvalleyinvestclub.com/test/' }
      ids: { description: 'id роликов через запятую (пусто — первые две карточки)', required: false, default: '' }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null
      - uses: ./.github/actions/install-playwright
        with:
          browsers: chromium
          playwright-version: '1.49.0'
      - name: check
        env:
          PENGUIN_SOCKS: ${{ secrets.PENGUIN_SOCKS }}
        run: |
          if [ -n "$PENGUIN_SOCKS" ]; then
            python3 -m pip install --quiet pproxy
            REMOTE=$(python3 -c "import sys,urllib.parse as u;p=u.urlparse(sys.argv[1]);print(f'socks5://{p.hostname}:{p.port}'+(f'#{u.unquote(p.username)}:{u.unquote(p.password)}' if p.username else ''))" "$PENGUIN_SOCKS")
            python3 -c "import sys,asyncio; asyncio.set_event_loop(asyncio.new_event_loop()); sys.argv=['pproxy']+sys.argv[1:]; from pproxy.server import main; main()" \
              -l http://127.0.0.1:8118 -r "$REMOTE" </dev/null >bridge.log 2>&1 &
            for _ in $(seq 1 20); do python3 -c "import socket;socket.create_connection(('127.0.0.1',8118),1).close()" 2>/dev/null && break; sleep 0.5; done
            export CHECK_PROXY=http://127.0.0.1:8118
          fi
          CHECK_URL="${{ inputs.url }}" CHECK_IDS="${{ inputs.ids }}" node scripts/date-tone-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: date-tone-check, path: out/ }
