name: desk-views
# Trade Desk on a phone: list and open page are two views, nothing overlays the
# list (desk-views.mjs). Fixture desk with the branch page, or the live platform
# with a QA session set for the run and deleted right after.
on:
  workflow_dispatch:
    inputs:
      engine: { description: 'webkit | chromium', default: 'webkit' }
      source: { description: 'fixture | live', default: 'fixture' }
      page: { description: 'branch | live (fixture source only)', default: 'branch' }
      candidate: { description: '1 = candidate preview (fixture source)', default: '0' }
      slot: { description: 'a | b — which QA session secret (DESK_COOKIES_A / _B), live source', default: 'a' }
      tag: { description: 'Artifact tag', default: 'run' }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null
      - uses: ./.github/actions/install-playwright
        with:
          browsers: ${{ inputs.engine }}
          playwright-version: '1.49.0'
      - run: rm -rf out && timeout 600 node desk-views.mjs
        env:
          ENGINE: ${{ inputs.engine }}
          SOURCE: ${{ inputs.source }}
          PAGE: ${{ inputs.page }}
          CANDIDATE: ${{ inputs.candidate }}
          DESK_COOKIES: ${{ inputs.slot == 'b' && secrets.DESK_COOKIES_B || secrets.DESK_COOKIES_A }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-views-${{ inputs.engine }}-${{ inputs.tag }}
          path: out/
