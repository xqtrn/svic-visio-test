name: frontpage-guard
# Сторож главной стенда: карточка от одной статьи и в своём блоке (Артур 2026-07-28).
# Молчит, пока всё в порядке; расхождение — задача на /developement и красный прогон
# (Артур 2026-08-03: «вместо этих сообщений сразу добавь задачи»).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i pg@8 --no-save
      - run: node scripts/frontpage-guard.mjs
        env:
          SVIC_PLATFORM_DATABASE_URL: ${{ secrets.SVIC_PLATFORM_DATABASE_URL }}
          SVIC_INTERNAL_KEY: ${{ secrets.SVIC_INTERNAL_KEY }}
