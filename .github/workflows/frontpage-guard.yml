name: frontpage-guard
# Сторож главной стенда: карточка от одной статьи и в своём блоке (Артур 2026-07-28).
# Правило судит горло стенда (heal=true) и само открывает/закрывает карточку.
# Этот прогон — будильник горла; своя карточка — только если стенд молчит дольше
# окна пересборки (2026-09-30). Доступа к базе у сторожа нет и не нужно.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/frontpage-guard.mjs
        env:
          SVIC_API_ORIGIN: https://siliconvalleyinvestclub.com
          SVIC_INTERNAL_KEY: ${{ secrets.SVIC_INTERNAL_KEY }}
