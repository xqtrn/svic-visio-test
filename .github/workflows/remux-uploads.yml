name: remux-uploads
on:
  repository_dispatch:
    types: [video-uploaded]
  schedule:
    - cron: '25 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-captions-${{ github.event.client_payload.id || 'nightly' }}
  cancel-in-progress: false

jobs:
  remux-and-caption:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-captions.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-v1
      - run: npm init -y >/dev/null 2>&1 && npm i pg >/dev/null 2>&1
      - run: pip install -r requirements-captions.txt
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node remux-uploads.mjs
        env:
          DATABASE_URL: ${{ secrets.SVIC_PLATFORM_DATABASE_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_VIDEO_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_VIDEO_SECRET_ACCESS_KEY }}
          S3_REGION: us-east-1
          S3_BUCKET: svic-video-archive
          VIDEO_ID: ${{ github.event.client_payload.id }}
          WHISPER_MODEL: small
