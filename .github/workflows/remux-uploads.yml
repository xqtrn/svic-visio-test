name: remux-uploads
on:
  repository_dispatch:
    types: [video-uploaded]
  schedule:
    - cron: '25 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-captions-${{ github.event.client_payload.id || 'nightly' }}
  cancel-in-progress: false

jobs:
  remux-and-caption:
    # Наш исполнитель на Railway (сервис ci-runner, Debian bookworm, root), а не
    # платные машины GitHub (2026-09-25: «GitHub исключаем из вычислений»).
    # Бюджет GitHub кончился — копии роликов не должны останавливаться вместе с ним.
    runs-on: [self-hosted, svic]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-v1
      - name: ffmpeg + python для распознавания (ставятся один раз на контейнер)
        run: |
          SUDO=$(command -v sudo || true)
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          python3 -c 'import ensurepip' >/dev/null 2>&1 || need="$need python3-venv"
          if [ -n "$need" ]; then $SUDO apt-get update -qq && $SUDO apt-get install -y -qq $need; fi
          [ -x "$HOME/.venv-captions/bin/pip" ] || { rm -rf "$HOME/.venv-captions"; python3 -m venv "$HOME/.venv-captions"; }
          "$HOME/.venv-captions/bin/pip" install -q -r requirements-captions.txt
          echo "PYTHON=$HOME/.venv-captions/bin/python" >> "$GITHUB_ENV"
      - run: npm init -y >/dev/null 2>&1 && npm i pg >/dev/null 2>&1
      - run: node remux-uploads.mjs
        env:
          DATABASE_URL: ${{ secrets.SVIC_PLATFORM_DATABASE_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_VIDEO_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_VIDEO_SECRET_ACCESS_KEY }}
          S3_REGION: auto
          S3_BUCKET: svic-media
          S3_ENDPOINT: ${{ secrets.S3_VIDEO_ENDPOINT }}
          VIDEO_ID: ${{ github.event.client_payload.id }}
          WHISPER_MODEL: small
