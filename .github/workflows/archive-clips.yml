name: archive-clips
# Ролик статьи с YouTube-ссылкой доезжает до нашего домена сам (Артур 2026-07-28).
# Релиз clips упёрся в потолок GitHub (1000 активов) и молча переставал принимать
# новые файлы — копия кладётся в наше хранилище, туда же, куда кладёт админка.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade yt-dlp
          npm i pg@8 @aws-sdk/client-s3@3 --no-save
      - run: node archive-missing-clips.mjs
        env:
          DATABASE_URL: ${{ secrets.SVIC_PLATFORM_DATABASE_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_VIDEO_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_VIDEO_SECRET_ACCESS_KEY }}
          S3_REGION: auto
          S3_BUCKET: svic-media
          S3_ENDPOINT: ${{ secrets.S3_VIDEO_ENDPOINT }}
          PENGUIN_SOCKS: ${{ secrets.PENGUIN_SOCKS }}
