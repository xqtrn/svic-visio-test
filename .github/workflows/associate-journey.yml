name: associate-journey
# A new associate's path after Serge's yes — the setup link, four setup steps with
# the real e-signature, the welcome window, Your path and every section in the menu —
# in a real browser (WebKit iPhone or desktop Chromium), on a QA TEST CANDIDATE only.
on:
  workflow_dispatch:
    inputs:
      engine: { description: 'webkit | chromium', default: 'webkit' }
      phase: { description: 'all | platform', default: 'all' }
      sign_name: { description: 'Typed signature (the test candidate name)', default: 'Test Candidate' }
      tag: { description: 'Artifact tag', default: 'run' }
      slot: { description: 'a | b — which test candidate link secret (AJ_WELCOME_A / AJ_WELCOME_B)', default: 'a' }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null
      - uses: ./.github/actions/install-playwright
        with:
          browsers: ${{ inputs.engine }}
          playwright-version: '1.49.0'
      - run: rm -rf out && timeout 1200 node associate-journey.mjs
        env:
          ENGINE: ${{ inputs.engine }}
          PHASE: ${{ inputs.phase }}
          SIGN_NAME: ${{ inputs.sign_name }}
          # the QA test candidate's setup link, set for the run and deleted right after
          AJ_WELCOME: ${{ inputs.slot == 'b' && secrets.AJ_WELCOME_B || secrets.AJ_WELCOME_A }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: associate-journey-${{ inputs.engine }}-${{ inputs.tag }}
          path: out/
